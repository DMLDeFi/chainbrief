[project]
name = "quantedge"
version = "0.1.0"
description = "QuantEdge AI Elite — selective Bybit USDT-perpetual signal engine (paper-trading first)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "websockets>=12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantedge*"]

[tool.setuptools.package-data]
quantedge = ["dashboard/*.html", "dashboard/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
