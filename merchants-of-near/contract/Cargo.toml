[package]
name = "merchants-of-near"
version = "1.0.0"
edition = "2021"
description = "On-chain business deeds, deed marketplace settlement and soulbound achievements for Merchants of NEAR"
license = "MIT"
repository = "https://github.com/dmldefi/chainbrief"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
