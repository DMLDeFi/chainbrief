<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8f6a24"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#00a36a"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#faf6ee"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#2a1f14">Merchants of NEAR — architecture</text>
  <text x="30" y="62" font-size="13" fill="#6b5a44">Authoritative simulation off-chain; ownership and settlement on NEAR</text>

  <!-- Browser -->
  <rect x="30" y="90" width="300" height="300" rx="14" fill="#fff" stroke="#c9b895" stroke-width="1.5"/>
  <text x="50" y="118" font-size="15" font-weight="700" fill="#2a1f14">Browser · Next.js 16 + React 19</text>
  <rect x="50" y="135" width="260" height="70" rx="10" fill="#f3ead6"/>
  <text x="62" y="158" font-size="13" font-weight="700" fill="#2a1f14">Phaser 3 isometric town</text>
  <text x="62" y="177" font-size="11.5" fill="#5a4a36">procedural art · day/night · weather</text>
  <text x="62" y="193" font-size="11.5" fill="#5a4a36">NPCs animated from real trades</text>
  <rect x="50" y="215" width="260" height="70" rx="10" fill="#f3ead6"/>
  <text x="62" y="238" font-size="13" font-weight="700" fill="#2a1f14">HUD + 10 panels (Tailwind)</text>
  <text x="62" y="257" font-size="11.5" fill="#5a4a36">market · merchants · businesses · economy</text>
  <text x="62" y="273" font-size="11.5" fill="#5a4a36">ledger · leaderboards · progress · wallet</text>
  <rect x="50" y="295" width="260" height="78" rx="10" fill="#e3f7ee" stroke="#00a36a"/>
  <text x="62" y="318" font-size="13" font-weight="700" fill="#0a5a3a">NEAR Connect wallet</text>
  <text x="62" y="337" font-size="11.5" fill="#245a44">NEP-413 signMessage (login)</text>
  <text x="62" y="353" font-size="11.5" fill="#245a44">signAndSendTransaction (deeds,</text>
  <text x="62" y="367" font-size="11.5" fill="#245a44">marketplace, badges) — keys stay in wallet</text>

  <!-- Server -->
  <rect x="400" y="90" width="330" height="420" rx="14" fill="#fff" stroke="#c9b895" stroke-width="1.5"/>
  <text x="420" y="118" font-size="15" font-weight="700" fill="#2a1f14">Game server · Node + Fastify 5</text>
  <rect x="420" y="135" width="290" height="60" rx="10" fill="#f3ead6"/>
  <text x="432" y="158" font-size="13" font-weight="700" fill="#2a1f14">API gateway</text>
  <text x="432" y="177" font-size="11.5" fill="#5a4a36">scrypt auth · httpOnly sessions · zod · rate</text>
  <text x="432" y="190" font-size="11.5" fill="#5a4a36">limits · idempotency keys</text>
  <rect x="420" y="205" width="290" height="150" rx="10" fill="#fbe9d6" stroke="#d9a84a"/>
  <text x="432" y="228" font-size="13" font-weight="700" fill="#2a1f14">@mon/engine (authoritative, deterministic)</text>
  <text x="432" y="248" font-size="11.5" fill="#5a4a36">price-discovery exchange × 2 markets</text>
  <text x="432" y="264" font-size="11.5" fill="#5a4a36">10 autonomous merchant agents</text>
  <text x="432" y="280" font-size="11.5" fill="#5a4a36">citizens · seasons · weather · events</text>
  <text x="432" y="296" font-size="11.5" fill="#5a4a36">credit model · bankruptcy · succession</text>
  <text x="432" y="312" font-size="11.5" fill="#5a4a36">businesses · missions · levels · P2P escrow</text>
  <text x="432" y="332" font-size="11.5" font-weight="700" fill="#8f6a24">tick loop: 1 in-game hour / 2 s · fast-forward</text>
  <rect x="420" y="365" width="140" height="60" rx="10" fill="#f3ead6"/>
  <text x="432" y="388" font-size="13" font-weight="700" fill="#2a1f14">Dialogue layer</text>
  <text x="432" y="406" font-size="11" fill="#5a4a36">Claude (optional)</text>
  <text x="432" y="419" font-size="11" fill="#5a4a36">deterministic fallback</text>
  <rect x="570" y="365" width="140" height="60" rx="10" fill="#e3f7ee" stroke="#00a36a"/>
  <text x="582" y="388" font-size="13" font-weight="700" fill="#0a5a3a">NEAR service</text>
  <text x="582" y="406" font-size="11" fill="#245a44">NEP-413 verify · certs</text>
  <text x="582" y="419" font-size="11" fill="#245a44">tx verify · deed sync</text>
  <rect x="420" y="435" width="290" height="58" rx="10" fill="#f3ead6"/>
  <text x="432" y="458" font-size="13" font-weight="700" fill="#2a1f14">WebSocket world stream</text>
  <text x="432" y="477" font-size="11.5" fill="#5a4a36">read-only snapshots + activity feed every tick</text>

  <!-- Storage -->
  <rect x="790" y="90" width="280" height="150" rx="14" fill="#fff" stroke="#c9b895" stroke-width="1.5"/>
  <text x="810" y="118" font-size="15" font-weight="700" fill="#2a1f14">PostgreSQL · Prisma 7</text>
  <text x="810" y="142" font-size="12" fill="#5a4a36">User · Session (token hashes)</text>
  <text x="810" y="160" font-size="12" fill="#5a4a36">WorldSnapshot (JSON)</text>
  <text x="810" y="178" font-size="12" fill="#5a4a36">LedgerEntry (every gold movement)</text>
  <text x="810" y="196" font-size="12" fill="#5a4a36">IdempotencyKey · NearChallenge</text>
  <text x="810" y="214" font-size="12" fill="#5a4a36">ChainTransaction (verified status)</text>
  <text x="810" y="232" font-size="11" fill="#8a7a64">JSON file store when DATABASE_URL unset</text>

  <!-- NEAR -->
  <rect x="790" y="290" width="280" height="220" rx="14" fill="#e3f7ee" stroke="#00a36a" stroke-width="1.5"/>
  <text x="810" y="318" font-size="15" font-weight="700" fill="#0a5a3a">NEAR testnet · Rust contract</text>
  <text x="810" y="342" font-size="12" fill="#245a44">claim_deed — ed25519_verify(game cert)</text>
  <text x="810" y="360" font-size="12" fill="#245a44">list_deed / buy_deed — atomic NEAR</text>
  <text x="810" y="376" font-size="12" fill="#245a44">  settlement, 2.5% fee, refunds</text>
  <text x="810" y="394" font-size="12" fill="#245a44">transfer_deed (1 yocto)</text>
  <text x="810" y="412" font-size="12" fill="#245a44">record_achievement — soulbound</text>
  <text x="810" y="430" font-size="12" fill="#245a44">nonce replay + expiry protection</text>
  <text x="810" y="448" font-size="12" fill="#245a44">NEP-297 events · views</text>
  <text x="810" y="476" font-size="11" fill="#245a44">RPC: access keys, tx status, get_deed</text>

  <!-- arrows -->
  <path d="M330 175 L400 165" stroke="#8f6a24" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="334" y="132" font-size="11" fill="#8f6a24">REST /api</text>
  <path d="M420 465 L330 250" stroke="#8f6a24" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="300" y="430" font-size="11" fill="#8f6a24">WS /ws</text>
  <path d="M730 165 L790 165" stroke="#8f6a24" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M330 340 C 560 600, 700 560, 790 470" stroke="#00a36a" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="470" y="590" font-size="11" fill="#00a36a">wallet-signed transactions (user pays gas)</text>
  <path d="M710 395 L790 395" stroke="#00a36a" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="712" y="385" font-size="10.5" fill="#00a36a">verify</text>
  <path d="M570 395 C 470 380, 380 360, 330 345" stroke="#00a36a" stroke-width="1.6" fill="none" marker-end="url(#g)" stroke-dasharray="4 4"/>
  <text x="352" y="398" font-size="10.5" fill="#00a36a">signed certificate</text>
</svg>
